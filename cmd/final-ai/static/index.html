<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>final-ai</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaed;
      --accent: #6c9eff;
      --user-bg: #252b3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    #history {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .turn { display: flex; flex-direction: column; gap: 0.5rem; }
    .user-row { display: flex; justify-content: flex-end; }
    .user-bubble {
      max-width: 72%;
      background: var(--user-bg);
      border: 1px solid var(--border);
      border-radius: 1rem 1rem 0.25rem 1rem;
      padding: 0.75rem 1rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .assistant {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      background: var(--surface);
    }
    #prompt {
      flex: 1;
      resize: none;
      min-height: 2.75rem;
      max-height: 12rem;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      line-height: 1.4;
    }
    #prompt:focus { outline: 2px solid var(--accent); border-color: transparent; }
    #send {
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 0.75rem;
      background: var(--accent);
      color: #0f1117;
      font-weight: 600;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ff8a80; font-size: 0.9rem; padding: 0 1.25rem 0.5rem; }
  </style>
</head>
<body>
  <header>final-ai</header>
  <div id="history"></div>
  <div id="error" class="error" hidden></div>
  <div class="composer">
    <textarea id="prompt" rows="1" placeholder="Message…"></textarea>
    <button type="button" id="send">Send</button>
  </div>
  <script>
    const historyEl = document.getElementById('history');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const errorEl = document.getElementById('error');

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 12 * 16) + 'px';
    }
    promptEl.addEventListener('input', () => autoGrow(promptEl));

    function appendTurn(user, assistant) {
      const turn = document.createElement('div');
      turn.className = 'turn';
      const userRow = document.createElement('div');
      userRow.className = 'user-row';
      const bubble = document.createElement('div');
      bubble.className = 'user-bubble';
      bubble.textContent = user;
      userRow.appendChild(bubble);
      turn.appendChild(userRow);
      const asst = document.createElement('div');
      asst.className = 'assistant';
      asst.textContent = assistant;
      turn.appendChild(asst);
      historyEl.appendChild(turn);
      historyEl.scrollTop = historyEl.scrollHeight;
    }

    async function send() {
      const message = promptEl.value.trim();
      if (!message) return;
      errorEl.hidden = true;
      sendBtn.disabled = true;
      promptEl.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        appendTurn(message, data.reply || '');
        promptEl.value = '';
        autoGrow(promptEl);
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.hidden = false;
      } finally {
        sendBtn.disabled = false;
        promptEl.disabled = false;
        promptEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
